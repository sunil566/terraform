pipeline:
  name: Terraform EC2 Provision
  identifier: Terraform_EC2_Provision
  projectIdentifier: default_project
  orgIdentifier: default
  description: Plan, approve and apply Terraform EC2 provisioning
  properties:
    ci:
      codebase:
        connectorRef: Terraform
        repoName: terraform
        build:
          type: branch
          spec:
            branch: main
  stages:
    - stage:
        name: Plan
        identifier: Plan
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Terraform Plan
                  identifier: Terraform_Plan
                  spec:
                    connectorRef: account.harnessImage
                    image: hashicorp/terraform:1.10.5
                    shell: Sh
                    command: |-
                      set -eu
                      apk add --no-cache aws-cli
                      terraform init -input=false
                      terraform fmt -check -recursive
                      terraform validate
                      terraform plan -input=false -out=tfplan
                      aws s3 cp tfplan "s3://suneel-k8s-demo/terraform/plans/<+pipeline.executionId>/tfplan" --region ap-south-1 --sse AES256
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("AWS_ACCESS_KEY_ID")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("AWS")>
                      AWS_DEFAULT_REGION: ap-south-1
    - stage:
        name: Approval
        identifier: Approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Terraform Apply
                  identifier: Approve_Terraform_Apply
                  timeout: 1d
                  spec:
                    approvalMessage: Review the Terraform plan from the Plan stage before approving the apply.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: <+input>
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
                    approverInputs: []
    - stage:
        name: Apply
        identifier: Apply
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Apply Approved Plan
                  identifier: Apply_Approved_Plan
                  spec:
                    connectorRef: account.harnessImage
                    image: hashicorp/terraform:1.10.5
                    shell: Sh
                    command: |-
                      set -eu
                      apk add --no-cache aws-cli
                      terraform init -input=false
                      aws s3 cp "s3://suneel-k8s-demo/terraform/plans/<+pipeline.executionId>/tfplan" tfplan --region ap-south-1
                      terraform apply -input=false tfplan
                      aws s3 rm "s3://suneel-k8s-demo/terraform/plans/<+pipeline.executionId>/tfplan" --region ap-south-1
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("AWS_ACCESS_KEY_ID")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("AWS")>
                      AWS_DEFAULT_REGION: ap-south-1
